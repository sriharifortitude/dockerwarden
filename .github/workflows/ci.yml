name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Ruff, mypy, pytest, and the README's example from the built wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest -q
      - name: Build the wheel, install it clean, and diff the README's example against real output
        run: |
          pip install build && python -m build --wheel
          python -m venv /tmp/wheel && /tmp/wheel/bin/pip install dist/*.whl
          PATH="/tmp/wheel/bin:$PATH" ./scripts/check-readme.sh
      - name: the clean fixture must pass at the strictest level
        run: dockerwarden scan --fail-on low testdata/clean

  secrets:
    name: credsweep over the full commit history
    runs-on: ubuntu-latest
    steps:
      # A shallow clone would let credsweep report a false all-clear.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: '1.27' }
      - run: go install github.com/sriharifortitude/credsweep/cmd/credsweep@v0.1.2
      - run: credsweep scan .
