[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dockerwarden"
version = "0.1.0"
description = "A security linter for Dockerfiles: unpinned base images, root users, secrets in layers, downloads piped into a shell, disabled TLS verification."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Sri Hari Manikandan" }]
keywords = ["docker", "dockerfile", "security", "linter", "supply-chain", "containers"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "mypy>=1.13", "ruff>=0.8"]

[project.scripts]
dockerwarden = "dockerwarden.cli:main"

[project.urls]
Repository = "https://github.com/sriharifortitude/dockerwarden"

[tool.hatch.build.targets.wheel]
packages = ["src/dockerwarden"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "S", "PL", "N", "C4", "T20", "DTZ"]
ignore = ["PLR2004", "S101", "PLR0913", "PLR0911", "PLR0912", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ANN", "PLR", "T20", "E501"]
# The rule text is prose for people; a formatter cannot wrap a string.
"src/dockerwarden/rules.py" = ["E501"]
"src/dockerwarden/cli.py" = ["T20"]
"src/dockerwarden/report.py" = ["T20"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
